services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: elimapp-api
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - API_KEY=${API_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - RATE_LIMIT_WINDOW_MINUTES=${RATE_LIMIT_WINDOW_MINUTES:-15}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-100}
      - DATABASE_PATH=/data/database.sqlite
    volumes:
      - elimapp_db:/data
      - elimapp_updates:/app/public/updates
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  elimapp_db:
    name: elimapp_db
  elimapp_updates:
    name: elimapp_updates
